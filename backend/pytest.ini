[pytest]
# pytest configuration for NovaCart Dashboard backend tests
testpaths = tests .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=95
markers =
    integration: marks tests as integration tests (require database)
    unit: marks tests as unit tests (fast, no I/O)
    edge_case: marks tests that validate edge cases
    validation: marks tests that validate input handling
