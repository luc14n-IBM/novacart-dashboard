name: Resume Group

on:
  workflow_dispatch:
    inputs:
      group_number:
        description: 'Group number to resume (e.g. 1, 2, 3...)'
        required: true
        type: string

jobs:
  resume:
    runs-on: ubuntu-latest

    env:
      DB: NOVACART_DB
      SCHEMA: APP
      GROUP: ${{ github.event.inputs.group_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs==3.9.0 --quiet

      - name: Configure Snowflake connection
        env:
          SNOW_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOW_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOW_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOW_KEY" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          printf '[connections.spcs]\naccount = "%s"\nuser = "%s"\nauthenticator = "SNOWFLAKE_JWT"\nprivate_key_path = "/tmp/rsa_key.p8"\nrole = "NOVACART_ADMIN_ROLE"\n' \
            "$SNOW_ACCOUNT" "$SNOW_USER" > ~/.snowflake/config.toml
          chmod 0600 ~/.snowflake/config.toml

      - name: Resume services
        run: |
          snow sql --connection spcs -q "
          USE ROLE NOVACART_ADMIN_ROLE;
          USE DATABASE $DB;
          USE SCHEMA $SCHEMA;
          ALTER SERVICE IF EXISTS backend_service_group${GROUP}  RESUME;
          ALTER SERVICE IF EXISTS frontend_service_group${GROUP} RESUME;
          "

      - name: Wait and get URL
        run: |
          echo "Waiting for service to start..."
          sleep 90
          snow sql --connection spcs -q "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE frontend_service_group${GROUP};" --format json > /tmp/endpoints.json 2>/dev/null || true
          URL=$(python3 .github/scripts/get_url.py 2>/dev/null || echo "")
          echo "## ▶️ Group $GROUP is live" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://$URL" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Group $GROUP app URL: https://$URL"

      - name: Cleanup key material
        if: always()
        run: |
          rm -f /tmp/rsa_key.p8
          echo "Private key material removed from runner"
