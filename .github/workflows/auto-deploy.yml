name: Auto Deploy to SPCS

# Runs automatically on every push to main.
# Requires the following GitHub Actions secrets set on your fork:
#   SNOWFLAKE_PRIVATE_KEY  — contents of rsa_key.p8 (unencrypted)
#   SNOWFLAKE_USER         — Snowflake username (e.g. PGUERRERO)
#   REPO_URL               — Snowflake image repository URL (from SHOW IMAGE REPOSITORIES;)

on:
  push:
    branches: ["main", "BuildnPush"]
  workflow_dispatch:

# Minimum permissions — only what each job actually needs
permissions:
  contents: read   # checkout only

jobs:
  ci:
    name: Tests (must pass before deploy)
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: ci   # only deploy if tests pass

    # No additional permissions needed — all auth is via Snowflake JWT
    permissions:
      contents: read

    env:
      REPO_URL: ${{ secrets.REPO_URL }}
      GROUP: 5
      SNOWFLAKE_ACCOUNT: VEB81086.us-east-1
      DB: NOVACART_DB
      SCHEMA: APP
      EXT_ROLE: NOVACART_EXT_ROLE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        # Pin to a specific version — never install latest blindly in production
        run: pip install snowflake-cli-labs==3.9.0 --quiet

      - name: Configure Snowflake connection
        env:
          SNOW_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT }}
          SNOW_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOW_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          # Write the private key — echo handles real newlines from GitHub secrets correctly
          echo "$SNOW_KEY" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          # Debug: verify the PEM headers are present (does not expose key body)
          head -1 /tmp/rsa_key.p8
          tail -1 /tmp/rsa_key.p8
          wc -l /tmp/rsa_key.p8
          # Write config — field names must match Snowflake CLI exactly (private_key_file not private_key_path)
          cat > ~/.snowflake/config.toml << EOF
          [connections.spcs]
          account = "$SNOW_ACCOUNT"
          user = "$SNOW_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/tmp/rsa_key.p8"
          role = "NOVACART_ADMIN_ROLE"
          database = "NOVACART_DB"
          schema = "APP"
          warehouse = "NOVACART_APP_WH"
          EOF
          chmod 0600 ~/.snowflake/config.toml
          # Debug: print config (account/user are not secret)
          cat ~/.snowflake/config.toml

      - name: Verify key file permissions
        run: |
          # Fail fast if permissions are wrong — do not proceed with a world-readable key
          PERMS=$(stat -c '%a' /tmp/rsa_key.p8)
          if [ "$PERMS" != "600" ]; then
            echo "ERROR: rsa_key.p8 has unsafe permissions: $PERMS"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Snowflake registry
        run: |
          snow spcs image-registry login --connection spcs
          echo "Registry login successful. Testing connectivity..."
          docker info | grep -A 5 "Registry" || echo "Registry check completed"
          echo "Ready for image push"

      - name: Generate image tag
        id: tag
        run: echo "ts=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build & push backend
        env:
          TAG: ${{ steps.tag.outputs.ts }}
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t backend_service_image_group${GROUP}:${TAG} ./backend
          docker tag backend_service_image_group${GROUP}:${TAG} \
            $REPO_URL/backend_service_image_group${GROUP}:${TAG}
          docker tag backend_service_image_group${GROUP}:${TAG} \
            $REPO_URL/backend_service_image_group${GROUP}:latest
          echo "Pushing backend image (tagged as $TAG)..."
          timeout 600 docker push $REPO_URL/backend_service_image_group${GROUP}:${TAG} || exit 1
          echo "Pushing latest tag..."
          timeout 300 docker push $REPO_URL/backend_service_image_group${GROUP}:latest || exit 1

      - name: Build & push frontend
        env:
          TAG: ${{ steps.tag.outputs.ts }}
        run: |
          docker build --platform linux/amd64 \
            -t frontend_service_image_group${GROUP}:${TAG} ./frontend
          docker tag frontend_service_image_group${GROUP}:${TAG} \
            $REPO_URL/frontend_service_image_group${GROUP}:${TAG}
          docker tag frontend_service_image_group${GROUP}:${TAG} \
            $REPO_URL/frontend_service_image_group${GROUP}:latest
          echo "Pushing frontend image (tagged as $TAG)..."
          timeout 600 docker push $REPO_URL/frontend_service_image_group${GROUP}:${TAG} || exit 1
          echo "Pushing latest tag..."
          timeout 300 docker push $REPO_URL/frontend_service_image_group${GROUP}:latest || exit 1

      - name: Build & push router
        env:
          TAG: ${{ steps.tag.outputs.ts }}
        run: |
          docker build --platform linux/amd64 \
            -t router_service_image_group${GROUP}:${TAG} ./router
          docker tag router_service_image_group${GROUP}:${TAG} \
            $REPO_URL/router_service_image_group${GROUP}:${TAG}
          docker tag router_service_image_group${GROUP}:${TAG} \
            $REPO_URL/router_service_image_group${GROUP}:latest
          echo "Pushing router image (tagged as $TAG)..."
          timeout 600 docker push $REPO_URL/router_service_image_group${GROUP}:${TAG} || exit 1
          echo "Pushing latest tag..."
          timeout 300 docker push $REPO_URL/router_service_image_group${GROUP}:latest || exit 1

      - name: Recreate SPCS service
        env:
          SNOW_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT }}
          SNOW_USER: ${{ secrets.SNOWFLAKE_USER }}
          TAG: ${{ steps.tag.outputs.ts }}
        run: |
          snow sql --connection spcs -q "
          USE ROLE NOVACART_ADMIN_ROLE;
          USE DATABASE $DB;
          USE SCHEMA $SCHEMA;
          DROP SERVICE IF EXISTS FRONTEND_SERVICE_GROUP${GROUP};
          CREATE SERVICE FRONTEND_SERVICE_GROUP${GROUP}
            IN COMPUTE POOL NOVACART_BACKEND_POOL
            FROM SPECIFICATION \$\$
          spec:
            containers:
            - name: backend
              image: $REPO_URL/backend_service_image_group${GROUP}:${TAG}
              env:
                PORT: '8000'
                DATA_BACKEND: snowflake
                CLIENT_VALIDATION: Snowflake
                SNOWFLAKE_ACCOUNT: $SNOW_ACCOUNT
                SNOWFLAKE_USERNAME: $SNOW_USER
                SNOWFLAKE_ROLE: NOVACART_APP_ROLE
                SNOWFLAKE_DATABASE: NOVACART_DB
                SNOWFLAKE_SCHEMA: APP
                SNOWFLAKE_WAREHOUSE: NOVACART_APP_WH
            - name: frontend
              image: $REPO_URL/frontend_service_image_group${GROUP}:${TAG}
              env:
                PORT: '3000'
                REACT_APP_BACKEND_URL: /api
            - name: router
              image: $REPO_URL/router_service_image_group${GROUP}:${TAG}
              env:
                FRONTEND_SERVICE: localhost:3000
                BACKEND_SERVICE: localhost:8000
            endpoints:
            - name: routerendpoint
              port: 9000
              public: true
          \$\$
            MIN_INSTANCES=1 MAX_INSTANCES=1;
          GRANT SERVICE ROLE FRONTEND_SERVICE_GROUP${GROUP}!ALL_ENDPOINTS_USAGE TO ROLE $EXT_ROLE;
          "

      - name: Wait and report URL
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for service to be ready..."
          sleep 120
          for i in {1..15}; do
            echo "Polling for service endpoint ($i/15)..."
            snow sql --connection spcs -q \
              "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE FRONTEND_SERVICE_GROUP${GROUP};" \
              --format json > /tmp/endpoints.json || true
            URL=$(python3 .github/scripts/get_url.py || echo "")
            if [ -n "$URL" ]; then
              echo "✓ Service endpoint found: $URL"
              echo ""
              echo "Running diagnostics..."
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              # Test health endpoint with verbose output
              echo ""
              echo "Testing /health endpoint (backend):"
              HEALTH_RESPONSE=$(curl -s -w "\n%{http_code}" "https://$URL/health" 2>&1 || echo "Connection failed\n000")
              HEALTH_CODE=$(echo "$HEALTH_RESPONSE" | tail -1)
              HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | head -n -1)
              echo "HTTP Status: $HEALTH_CODE"
              echo "Response: $HEALTH_BODY"
              echo ""
              
              # Test root endpoint with redirect info
              echo "Testing / endpoint (frontend):"
              ROOT_RESPONSE=$(curl -s -i "https://$URL/" 2>&1 | head -20)
              echo "$ROOT_RESPONSE"
              echo ""
              
              # Test /api endpoint
              echo "Testing /api endpoint (router proxy):"
              API_RESPONSE=$(curl -s -i "https://$URL/api" 2>&1 | head -20)
              echo "$API_RESPONSE"
              echo ""
              
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              
              # If health returns 200, mark as ready
              if [ "$HEALTH_CODE" = "200" ]; then
                echo "✓ Backend is healthy"
                echo ""
                echo "## Deployed - Group $GROUP" >> $GITHUB_STEP_SUMMARY
                echo "**Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
                printf '**URL:** [https://%s](https://%s)\n' "$URL" "$URL" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "**Status:** All services healthy ✓" >> $GITHUB_STEP_SUMMARY
                printf 'App URL: https://%s\n' "$URL"
                exit 0
              else
                echo "Backend returning HTTP $HEALTH_CODE — still initializing..."
              fi
            fi
            echo "Still provisioning... ($i/15)"
            sleep 20
          done
          echo "⚠ Service provisioning incomplete — check Snowflake console for details"
          echo "Run: snow spcs service logs --service FRONTEND_SERVICE_GROUP${GROUP} --connection spcs"

      - name: Cleanup key material
        if: always()   # runs even if a prior step failed
        run: |
          rm -f /tmp/rsa_key.p8
          echo "Private key material removed from runner"
